#@TYPE: Machine
#@NAME: Ezurio Nitrogen 93 based platforms
#@SOC: i.MX93
#@DESCRIPTION: Machine configuration for Ezurio Nitrogen93 SMARC
#@MAINTAINER: Gary Bisson <gary.bisson@ezurio.com>

MACHINEOVERRIDES =. "mx93:"

IMX_DEFAULT_BSP ?= "nxp"

require conf/machine/include/imx-base.inc
require conf/machine/include/arm/armv8-2a/tune-cortexa55.inc

MACHINE_FIRMWARE:append = " ethos-u-firmware"

# Kernel configuration
PREFERRED_PROVIDER_virtual/kernel ??= "linux-boundary"
KERNEL_DEVICETREE = "freescale/imx93-nitrogen-smarc.dtb \
	freescale/imx93-nitrogen-smarc-ethosu.dtb \
	freescale/imx93-nitrogen-smarc-lvds.dtb \
	freescale/imx93-nitrogen-smarc-lvds-nx611.dtb \
	freescale/imx93-nitrogen-smarc-lvds-tevs.dtb \
	freescale/imx93-nitrogen-smarc-nx611.dtb \
	freescale/imx93-nitrogen-smarc-ov5640.dtb \
	freescale/imx93-nitrogen-smarc-rpmsg.dtb \
	freescale/imx93-nitrogen-smarc-spi-slave.dtb \
	freescale/imx93-nitrogen-smarc-tevs.dtb \
	freescale/imx93-nitrogen-smarc-ti351.dtb \
	freescale/imx93-nvc.dtb \
	freescale/imx93-nvc-rpmsg.dtb \
"
KERNEL_IMAGETYPE = "Image"
RRECOMMENDS:${KERNEL_PACKAGE_NAME}-base = ""

# U-Boot configuration
IMX_DEFAULT_BOOTLOADER:imx-nxp-bsp = "u-boot-boundary"
PREFERRED_PROVIDER_u-boot ??= "u-boot-boundary"
PREFERRED_PROVIDER_virtual/bootloader ??= "u-boot-boundary"
LOADADDR = ""
SPL_BINARY = "spl/u-boot-spl.bin"
UBOOT_DTB_NAME = "imx93-nitrogen-smarc.dtb"
UBOOT_MAKE_TARGET = ""
UBOOT_SUFFIX = "bin"
UBOOT_CONFIG ??= "sd"
UBOOT_CONFIG[sd]     = "imx93_nitrogen_smarc_defconfig,sdcard"

ATF_PLATFORM = "imx93"

DDR_FIRMWARE_NAME = " \
    lpddr4_dmem_1d_v202201.bin \
    lpddr4_dmem_2d_v202201.bin \
    lpddr4_imem_1d_v202201.bin \
    lpddr4_imem_2d_v202201.bin \
"

IMXBOOT_TARGETS = "flash_singleboot"
IMX_BOOT_SOC_TARGET = "iMX9"
IMX_BOOT_SEEK = "32"

IMAGE_BOOT_FILES:append = " \
	boot.scr-${MACHINE};boot.scr \
	upgrade.scr-${MACHINE};upgrade.scr \
	imx-boot-nitrogen93-sd.bin-flash_singleboot;u-boot.imx93_nitrogen_smarc \
"

# wic support
WKS_FILE = "sdimage-bootpart.wks"
WKS_FILE_DEPENDS += "u-boot-script-boundary"

SERIAL_CONSOLES = "115200;ttyLP0"
